name: Test, Lint

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:

jobs:
  test:
    name: Lint and test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go: [stable, oldstable]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go ${{ matrix.go }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Run linter (root module)
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          skip-cache: true

      - name: Run linter (slogor module)
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          skip-cache: true
          working-directory: slogor

      - name: Run linter (graylog module)
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          skip-cache: true
          working-directory: graylog

      - name: Run tests
        run: make test
