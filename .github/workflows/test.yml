name: Test, Lint

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:

env:
  GO_VERSION: "1.26"

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run linter (root module)
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          skip-cache: true

      - name: Run linter (slogor module)
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          skip-cache: true
          working-directory: slogor

      - name: Run tests
        run: make test
